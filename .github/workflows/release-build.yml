name: Prepare Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: npm ci --ignore-scripts
      - run: node tools/prepare-web.mjs
      - run: flutter analyze --no-pub
      - run: flutter test --timeout 30s
      - run: node --test tools/preview.test.mjs
      - name: Build unsigned release APKs for local signing
        env:
          MANXIA_UNSIGNED_RELEASE: 'true'
        run: flutter build apk --release --split-per-abi
      - name: Record build provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('build/app/outputs/flutter-apk')
          files = sorted(root.glob('*.apk'))
          assert len(files) == 3, f'Expected three APKs, got {files}'
          version = next(line.split(':', 1)[1].strip() for line in pathlib.Path('pubspec.yaml').read_text().splitlines() if line.startswith('version:'))
          info = {'version': version, 'mode': 'release', 'signed': False,
                  'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                  'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (root / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manxia-unsigned-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/build-info.json
          if-no-files-found: error
          retention-days: 14

  startup:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: manxia-unsigned-release
          path: unsigned
      - name: Make a disposable signed copy for emulator testing
        shell: bash
        run: |
          python3 -m pip install Pillow
          cp unsigned/app-x86_64-release.apk startup.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname 'CN=Manxia CI smoke only' -keyalg RSA -validity 7 -noprompt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke startup.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/android-startup-smoke.py startup.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-startup-android-${{ matrix.api }}
          path: startup-evidence/
          if-no-files-found: warn
