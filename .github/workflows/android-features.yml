name: Verify Android reading features
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: CI run containing manxia-android-profile
        required: true
      source_sha:
        description: Exact commit of the CI build
        required: true
permissions:
  contents: read
  actions: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the exact profile build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [ "$(gh run view "$BUILD_RUN" --json headSha --jq .headSha)" = "$SOURCE_SHA" ]
          gh run download "$BUILD_RUN" --name manxia-android-profile --dir prepared
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise reminder permissions and lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/android-follow-reminder-smoke.py prepared/app-profile.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: follow-android-${{ matrix.api }}
          path: follow-evidence/
          if-no-files-found: warn
