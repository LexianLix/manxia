name: Verify installed Android startup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version to install
        default: '0.3.0'
        required: true
      build_run:
        description: Optional unsigned build run to verify before publishing
        default: ''
        required: false
      upgrade_from:
        description: Optional older public version for signed in-place data retention check
        default: ''
        required: false
      candidate_url:
        description: Optional short-lived GitHub release asset URL for an unpublished signed candidate
        default: ''
        required: false
      candidate_sha256:
        description: Required SHA-256 when candidate_url is provided
        default: ''
        required: false
      arm64_translation:
        description: Experimental Android 11 ARM64 translation instead of native x86 tests
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Translation is opt-in: Android 11's translator rejected an ARM
        # instruction in testing. Never treat translation as physical ARM QA.
        include: ${{ fromJSON(inputs.arm64_translation && '[{"api":30,"abi":"arm64-v8a"}]' || '[{"api":30,"abi":"x86_64"},{"api":35,"abi":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the published or candidate APK
        env:
          VERSION: ${{ inputs.version }}
          ABI: ${{ matrix.abi }}
          BUILD_RUN: ${{ inputs.build_run }}
          UPGRADE_FROM: ${{ inputs.upgrade_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -n "$UPGRADE_FROM" ]; then
            [[ "$UPGRADE_FROM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release download "v$UPGRADE_FROM" --pattern "Manxia-$UPGRADE_FROM-$ABI.apk" --output previous-public.apk
          fi
          # Read the temporary URL from the event file instead of printing it
          # in a step's environment. Draft access does not need a write token.
          CANDIDATE_URL=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"].get("candidate_url", ""))')
          if [ -n "$CANDIDATE_URL" ]; then
            [ -z "$BUILD_RUN" ]
            python3 - <<'PY'
          import json, os, re, urllib.parse
          data = json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          url = urllib.parse.urlsplit(data['candidate_url'])
          assert url.scheme == 'https' and url.hostname == 'release-assets.githubusercontent.com'
          assert not url.username and not url.password and not url.fragment and not url.port
          assert re.fullmatch(r'[0-9a-f]{64}', data.get('candidate_sha256', ''))
          PY
            curl --fail --location --proto '=https' --max-time 180 "$CANDIDATE_URL" --output startup.apk
            CANDIDATE_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["candidate_sha256"])')
            printf '%s  startup.apk\n' "$CANDIDATE_SHA" | sha256sum --check
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs startup.apk
            if [ -f previous-public.apk ]; then cp previous-public.apk previous.apk; fi
          elif [ -n "$BUILD_RUN" ]; then
            [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
            gh run download "$BUILD_RUN" --name manxia-unsigned-release --dir unsigned
            cp "unsigned/app-$ABI-release.apk" startup.apk
            keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname 'CN=Manxia CI smoke only' -keyalg RSA -validity 7 -noprompt
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke startup.apk
            if [ -f previous-public.apk ]; then
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke --out previous.apk previous-public.apk
            fi
          else
            gh release download "v$VERSION" --pattern "Manxia-$VERSION-$ABI.apk" --output startup.apk
            if [ -f previous-public.apk ]; then cp previous-public.apk previous.apk; fi
          fi
          python3 -m pip install Pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-start release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            if [ -f previous.apk ]; then python3 tools/android-upgrade-smoke.py previous.apk startup.apk; fi
            python3 tools/android-startup-smoke.py startup.apk
            python3 tools/android-startup-smoke.py startup.apk --output startup-evidence/relaunch
            python3 tools/android-startup-smoke.py startup.apk --output startup-evidence/third
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-android-${{ matrix.api }}-${{ matrix.abi }}
          path: startup-evidence/
          if-no-files-found: warn
