name: Check and build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: npm ci --ignore-scripts
      - run: node tools/prepare-web.mjs
      - run: flutter analyze --no-pub
      - run: flutter test --timeout 30s
      - run: node --test tools/preview.test.mjs
      - run: flutter build web --no-web-resources-cdn --no-wasm-dry-run
      - run: node tools/offline-shell.mjs
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: manxia-web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: manxia-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
