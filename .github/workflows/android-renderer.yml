name: Diagnose Android emulator renderer

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Unsigned release build run to compare without rebuilding APKs
        required: true

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        renderer: [platform, skia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare identical candidate copies
        env:
          BUILD_RUN: ${{ inputs.build_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BUILD_RUN" --name manxia-unsigned-release --dir unsigned
          cp unsigned/app-x86_64-release.apk startup.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname 'CN=Manxia CI smoke only' -keyalg RSA -validity 7 -noprompt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias smoke startup.apk
          python3 -m pip install Pillow
          python3 -m unittest discover -s tools -p 'test_android*.py'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare three cold launches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 tools/android-startup-smoke.py startup.apk --renderer ${{ matrix.renderer }} --output startup-evidence/first
            python3 tools/android-startup-smoke.py startup.apk --renderer ${{ matrix.renderer }} --output startup-evidence/second
            python3 tools/android-startup-smoke.py startup.apk --renderer ${{ matrix.renderer }} --output startup-evidence/third
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-${{ matrix.renderer }}
          path: startup-evidence/
